
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorretrato | RUMOREG Photography</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 5%;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    a {
      color: #ccc;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-bottom: 45px;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(36px, 6vw, 68px);
      font-weight: 400;
      margin: 0 0 16px;
    }

    .intro {
      color: #aaa;
      max-width: 600px;
      line-height: 1.7;
      margin-bottom: 45px;
    }

    .gallery {
      columns: 3 240px;
      column-gap: 16px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 16px;
      break-inside: avoid;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 5%;
      }

      .gallery {
        columns: 2 140px;
        column-gap: 10px;
      }

      .gallery img {
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Volver a la página principal</a>

  <h1>Autorretrato</h1>
  <p class="intro">
    Una exploración personal a través de la fotografía.
  </p>

  <div class="gallery">
    <img src="images/images/autorretrato%20(1).jpg" alt="Autorretrato 1">
    <img src="images/images/autorretrato%20(2).jpg" alt="Autorretrato 2">
    <img src="images/images/autorretrato%20(3).jpg" alt="Autorretrato 3">
    <img src="images/images/autorretrato%20(4).jpg" alt="Autorretrato 4">
    <img src="images/images/autorretrato%20(5).jpg" alt="Autorretrato 5">
    <img src="images/images/autorretrato%20(6).jpg" alt="Autorretrato 6">
    <img src="images/images/autorretrato%20(7).jpg" alt="Autorretrato 7">
    <img src="images/images/autorretrato%20(8).jpg" alt="Autorretrato 8">
    <img src="images/images/autorretrato%20(9).jpg" alt="Autorretrato 9">
    <img src="images/images/autorretrato%20(10).jpg" alt="Autorretrato 10">
    <img src="images/images/autorretrato%20(11).jpg" alt="Autorretrato 11">
    <img src="images/images/autorretrato%20(12).jpg" alt="Autorretrato 12">
    <img src="images/images/autorretrato%20(13).jpg" alt="Autorretrato 13">
    <img src="images/images/autorretrato%20(14).jpg" alt="Autorretrato 14">
    <img src="images/images/autorretrato%20(15).jpg" alt="Autorretrato 15">
    <img src="images/images/autorretrato%20(16).jpg" alt="Autorretrato 16">
    <img src="images/images/autorretrato%20(17).jpg" alt="Autorretrato 17">
    <img src="images/images/autorretrato%20(18).jpg" alt="Autorretrato 18">
    <img src="images/images/autorretrato%20(19).jpg" alt="Autorretrato 19">
    <img src="images/images/autorretrato%20(20).jpg" alt="Autorretrato 20">
    <img src="images/images/autorretrato%20(21).jpg" alt="Autorretrato 21">
    <img src="images/images/autorretrato%20(22).jpg" alt="Autorretrato 22">
    <img src="images/images/autorretrato%20(23).jpg" alt="Autorretrato 23">
    <img src="images/images/autorretrato%20(24).jpg" alt="Autorretrato 24">
    <img src="images/images/autorretrato%20(25).jpg" alt="Autorretrato 25">

    <img src="images/images/autorretrato%20(29).jpg" alt="Autorretrato 29">

    <img src="images/images/autorretrato%20(31).jpg" alt="Autorretrato 31">
    <img src="images/images/autorretrato%20(32).jpg" alt="Autorretrato 32">
    <img src="images/images/autorretrato%20(33).jpg" alt="Autorretrato 33">
  </div>

<div id="visor" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96); z-index:9999; align-items:center; justify-content:center;">
  <button id="cerrar" aria-label="Cerrar" style="position:absolute; top:20px; right:25px; color:white; background:none; border:0; font-size:38px; cursor:pointer;">&times;</button>
  <button id="anterior" aria-label="Fotografía anterior" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:white; background:none; border:0; font-size:42px; cursor:pointer;">&#8249;</button>
  <img id="foto-ampliada" src="" alt="" style="max-width:86%; max-height:86vh; object-fit:contain;">
  <button id="siguiente" aria-label="Fotografía siguiente" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:white; background:none; border:0; font-size:42px; cursor:pointer;">&#8250;</button>
  <span id="contador" style="position:absolute; bottom:18px; color:#ccc; font-size:14px;"></span>
</div>

<script>
  const fotos = Array.from(document.querySelectorAll('.gallery img'));
  const visor = document.getElementById('visor');
  const fotoAmpliada = document.getElementById('foto-ampliada');
  const contador = document.getElementById('contador');
  let indice = 0;

  function mostrarFoto(n) {
    indice = (n + fotos.length) % fotos.length;
    fotoAmpliada.src = fotos[indice].src;
    fotoAmpliada.alt = fotos[indice].alt;
    contador.textContent = (indice + 1) + ' / ' + fotos.length;
    visor.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  fotos.forEach((foto, i) => {
    foto.style.cursor = 'zoom-in';
    foto.addEventListener('click', () => mostrarFoto(i));
  });

  document.getElementById('cerrar').addEventListener('click', cerrarVisor);
  document.getElementById('anterior').addEventListener('click', () => mostrarFoto(indice - 1));
  document.getElementById('siguiente').addEventListener('click', () => mostrarFoto(indice + 1));

  function cerrarVisor() {
    visor.style.display = 'none';
    document.body.style.overflow = '';
  }

  visor.addEventListener('click', (e) => {
    if (e.target === visor) cerrarVisor();
  });

  document.addEventListener('keydown', (e) => {
    if (visor.style.display !== 'flex') return;
    if (e.key === 'Escape') cerrarVisor();
    if (e.key === 'ArrowLeft') mostrarFoto(indice - 1);
    if (e.key === 'ArrowRight') mostrarFoto(indice + 1);
  });
</script>

</body>
</html>
